server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API: se redirige al contenedor del backend
    location /api/ {
        proxy_pass http://backend:8000;
        #proxy_pass https://g6x4777s-8080.use.devtunnels.ms/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # SPA: cualquier ruta del frontend carga index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
